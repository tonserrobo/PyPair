[project]
name = "pypair"
version = "0.1.0"
description = "Python-based short read alignment using learned indices and Gaussian Naive Bayes for genomic sequence alignment"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "MIT" }
authors = [
    { name = "Tony Robinson", email = "t.robinson@ulster.ac.uk" }
]
keywords = ["bioinformatics", "genomics", "alignment", "machine-learning", "naive-bayes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "Bio>=1.7.1",
    "biopython>=1.83",
    "imbalanced-learn>=0.11.0",
    "joblib>=1.2.0",
    "lightgbm>=4.3.0",
    "matplotlib>=3.8.0",
    "memory-profiler>=0.61.0",
    "numba>=0.59.0",
    "numpy>=1.24.0,<2.0.0",  # Vaex compatibility
    "pandas>=2.0.0,<3.0.0",
    "polars>=1.0.0",
    "pysam>=0.22.0",
    "scikit-learn>=1.2.0,<1.3.0",
    "shap>=0.45.0",
    "vaex>=4.17.0",
    "xgboost>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
]

hpc = [
    "researchpy>=0.3.0",
    "seaborn>=0.12.0",
]

cpp = [
    "pybind11>=2.11.0",
]

[project.scripts]
pypair = "pypair.cli:main"
pypair-train = "pypair.training.multimodel_training:main"
pypair-predict = "pypair.predict_seeds:main"
pypair-benchmark = "pypair.models.benchmark:main"

[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pypair*"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=pypair --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
